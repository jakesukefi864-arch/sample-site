<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="man.css">
    <title>Sample Site | Home</title>
</head>
<body>

    <header class="header">
        <a class="brand" href="mannn.html"><span>SAMPLE</span>SITE</a>
        <ul>
            <li><a class="active" href="mannn.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
        </ul>
    </header>

    <main class="hero">
        <div class="hero-copy">
            <p class="eyebrow">A small corner of the web</p>

            <h1>Make room for<br><span>good ideas.</span></h1>

            <p class="intro">
                A simple, welcoming place to share thoughtful work,
                useful features, and a little inspiration.
            </p>

            <a class="button" href="features.html">
                Explore the site <span aria-hidden="true">&#8594;</span>
            </a>
        </div>

        <a class="image-link" href="features.html">
            <img
                src="img/WhatsApp Image 2026-07-29 at 11.17.31.jpeg"
                alt="A bright, colorful moment captured in a photograph"
            >
        </a>
    </main>

    <section class="contact-section home-contact" aria-labelledby="contact-title">
        <div>
            <p class="eyebrow">Have something to say?</p>
            <h2 id="contact-title">Send a message.</h2>
        </div>

        <form
            class="contact-form"
            id="contact-form"
            action="https://formspree.io/f/xjybplbz"
            method="POST"
        >
            <label for="name">Name</label>
            <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                required
            >

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="4"
                required
            ></textarea>

            <button class="button" type="submit">
                Send email <span aria-hidden="true">&#8594;</span>
            </button>

            <p class="form-status" id="form-status" role="status"></p>
        </form>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Sample Site</p>
        <p>Made for curious people.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
